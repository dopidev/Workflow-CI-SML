name: MLflow Training CI/CD - Advanced

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  training:
    runs-on: ubuntu-latest
    
    steps:
      # ========== STEP 1: SET UP JOB ==========
      - name: Set up job
        run: echo "🚀 Starting MLflow Training Job"
      
      # ========== STEP 2: CHECKOUT ==========
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4
      
      # ========== STEP 3: SET UP PYTHON & CONDA ==========
      - name: Set up Python 3.12.7 and Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.12.7
          activate-environment: ml-training-env
      
      # ========== STEP 4: CHECK ENVIRONMENT ==========
      - name: Check Env
        run: |
          echo "✅ Python: $(python --version)"
          echo "✅ Conda: $(conda --version)"
          echo "✅ Current directory: $(pwd)"
          ls -la MLProject/
      
      # ========== STEP 5: CREATE CONDA ENV FROM CONDA.YAML ==========
      - name: Create conda environment
        shell: bash -l {0}
        run: |
          cd MLProject
          conda env create -f conda.yaml -n ml-training-env 2>/dev/null || conda env update -n ml-training-env -f conda.yaml
          echo "✅ Conda environment 'ml-training-env' created"
      
      # ========== STEP 6: RUN TRAINING (DIRECT PYTHON, NO MLFLOW RUN) ==========
      - name: Run training
        shell: bash -l {0}
        run: |
          cd MLProject
          conda run -n ml-training-env python modelling.py --test_size 0.2 --random_state 42
      
      # ========== STEP 7: GET LATEST MLFLOW RUN_ID ==========
      - name: Get latest MLflow run_id
        run: |
          cd MLProject
          if [ -f "run_id.txt" ]; then
            RUN_ID=$(cat run_id.txt)
            echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
            echo "✅ Run ID: $RUN_ID"
          else
            echo "⚠️ run_id.txt not found"
          fi
      
      # ========== STEP 8: INSTALL PYTHON DEPENDENCIES ==========
      - name: Install Python dependencies
        run: |
          pip install google-auth google-auth-oauthlib google-api-python-client
      
      # ========== STEP 9: UPLOAD TO GOOGLE DRIVE (via artifact) ==========
      - name: Upload to Google Drive
        run: |
          cd MLProject
          zip -r mlflow-models.zip mlruns/
          echo "✅ Models compressed: mlflow-models.zip"
          ls -lh mlflow-models.zip
      
      # ========== STEP 10: BUILD DOCKER MODEL ==========
      - name: Build Docker Model
        run: |
          cd MLProject
          MODEL_PATH=$(find mlruns -name "random_forest_model" -type d | head -1)
          if [ -n "$MODEL_PATH" ]; then
            echo "✅ Model found at: $MODEL_PATH"
            mlflow models build-docker \
              -m "$MODEL_PATH" \
              -n "customer-shopping-model:latest" \
              --enable-mlserver
          else
            echo "⚠️ Model not found"
            exit 1
          fi
      
      # ========== STEP 11: LOG IN TO DOCKER HUB ==========
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # ========== STEP 12: TAG DOCKER IMAGE ==========
      - name: Tag Docker Image
        run: |
          docker tag customer-shopping-model:latest ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:latest
          docker tag customer-shopping-model:latest ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:${{ github.run_number }}
      
      # ========== STEP 13: PUSH DOCKER IMAGE ==========
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:${{ github.run_number }}
      
      # ========== STEP 14: UPLOAD ARTIFACT ==========
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-models
          path: MLProject/mlruns/
          retention-days: 30
      
      # ========== STEP 15: POST LOG IN TO DOCKER HUB ==========
      - name: Post Log in to Docker Hub
        run: echo "✅ Docker Hub operations completed"
      
      # ========== STEP 16: POST SET UP PYTHON ==========
      - name: Post Set Up Python 3.12.7
        run: echo "✅ Python environment cleanup complete"
      
      # ========== STEP 17: POST RUN ACTIONS/CHECKOUT ==========
      - name: Post Run actions/checkout@v4
        run: echo "✅ Repository checkout cleanup complete"
      
      # ========== STEP 18: COMPLETE JOB ==========
      - name: Complete job
        run: |
          echo "=========================================="
          echo "🎉 JOB COMPLETED SUCCESSFULLY!"
          echo "=========================================="
          echo "📊 Run ID: ${{ env.RUN_ID }}"
          echo "🐳 Docker image: ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:latest"
          echo "📦 Artifact: mlflow-models"
          echo "=========================================="