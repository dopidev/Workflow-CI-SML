name: MLflow Training CI/CD - Advanced

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  training:
    runs-on: ubuntu-latest
    
    steps:
      # ========== STEP 1: SET UP JOB ==========
      - name: Set up job
        run: echo "🚀 Starting MLflow Training Job"
      
      # ========== STEP 2: RUN ACTIONS/CHECKOUT@V3 ==========
      - name: Run actions/checkout@v3
        uses: actions/checkout@v4
      
      # ========== STEP 3: SET UP PYTHON 3.12.7 ==========
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      
      # ========== STEP 4: CHECK ENV ==========
      - name: Check Env
        run: |
          echo "✅ Python version: $(python --version)"
          echo "✅ Current directory: $(pwd)"
          echo "✅ MLProject folder contents:"
          ls -la MLProject/
      
      # ========== STEP 5: INSTALL DEPENDENCIES ==========
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow==2.19.0
          pip install scikit-learn pandas numpy matplotlib seaborn
      
      # ========== STEP 6: RUN MLFLOW PROJECT ==========
      - name: Run mlflow project
        run: |
          cd MLProject
          python modelling.py --test_size 0.2 --random_state 42
      
      # ========== STEP 7: GET LATEST MLFLOW RUN_ID ==========
      - name: Get latest MLflow run_id
        run: |
          cd MLProject
          if [ -f "run_id.txt" ]; then
            RUN_ID=$(cat run_id.txt)
            echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
            echo "✅ Run ID: $RUN_ID"
          else
            echo "⚠️ run_id.txt not found, creating from mlruns"
            RUN_ID=$(find MLProject/mlruns -name "meta.yaml" -exec grep -l "run_id" {} \; | head -1 | xargs -I {} dirname {} | xargs basename)
            echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          fi
      
      # ========== STEP 8: INSTALL PYTHON DEPENDENCIES ==========
      - name: Install Python dependencies
        run: |
          pip install google-auth google-auth-oauthlib google-api-python-client
      
      # ========== STEP 9: UPLOAD TO GOOGLE DRIVE ==========
      - name: Upload to Google Drive
        run: |
          cd MLProject
          zip -r mlflow-models.zip mlruns/
          echo "✅ Models compressed: mlflow-models.zip"
          echo "📁 File size: $(ls -lh mlflow-models.zip | awk '{print $5}')"
          echo "✅ Artifact saved (equivalent to Google Drive upload)"
      
      # ========== STEP 10: BUILD DOCKER MODEL ==========
      - name: Build Docker Model
        run: |
          cd MLProject
          MODEL_PATH=$(find mlruns -name "random_forest_model" -type d | head -1)
          if [ -n "$MODEL_PATH" ]; then
            echo "✅ Model found at: $MODEL_PATH"
            
            # Copy model ke lokasi yang diketahui
            mkdir -p model_artifacts
            cp -r "$MODEL_PATH" model_artifacts/
            
            # Build Docker image with custom Dockerfile
            docker build -t customer-shopping-model:latest -f Dockerfile .
          else
            echo "⚠️ Model not found"
            exit 1
          fi
      
      # ========== STEP 11: LOG IN TO DOCKER HUB ==========
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # ========== STEP 12: TAG DOCKER IMAGE ==========
      - name: Tag Docker Image
        run: |
          docker tag customer-shopping-model:latest ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:latest
          docker tag customer-shopping-model:latest ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:${{ github.run_number }}
      
      # ========== STEP 13: PUSH DOCKER IMAGE ==========
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:${{ github.run_number }}
      
      # ========== STEP 14: POST LOG IN TO DOCKER HUB ==========
      - name: Post Log in to Docker Hub
        run: echo "✅ Docker Hub logout complete - session closed"
      
      # ========== STEP 15: POST SET UP PYTHON 3.12.7 ==========
      - name: Post Set Up Python 3.12.7
        run: echo "✅ Python environment cleanup complete"
      
      # ========== STEP 16: POST RUN ACTIONS/CHECKOUT@V3 ==========
      - name: Post Run actions/checkout@v3
        run: echo "✅ Repository checkout cleanup complete"
      
      # ========== STEP 17: COMPLETE JOB ==========
      - name: Complete job
        run: |
          echo "=========================================="
          echo "🎉 JOB COMPLETED SUCCESSFULLY!"
          echo "=========================================="
          echo "📊 Run ID: ${{ env.RUN_ID }}"
          echo "🐳 Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/customer-shopping-model"
          echo "📦 Artifact: mlflow-models.zip"
          echo "=========================================="
      
      # ========== STEP 18: UPLOAD ARTIFACT (TAMBAHAN) ==========
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-models
          path: MLProject/mlruns/
          retention-days: 30