name: MLflow Training CI/CD - Advanced

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Number of trees'
        required: false
        default: '100'
      max_depth:
        description: 'Max depth (0 for None)'
        required: false
        default: '10'

jobs:
  training:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up job
        run: echo "🚀 Starting MLflow Training Job"
      
      - name: Run actions/checkout@v3
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12.7 and Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.12.7
      
      - name: Check Env
        run: |
          echo "✅ Python version: $(python --version)"
          echo "✅ Conda version: $(conda --version)"
          echo "✅ MLProject folder contents:"
          ls -la MLProject/
      
      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0
      
      # ========== STEP 6: RUN MLFLOW PROJECT ==========
      - name: Run mlflow project
        shell: bash -l {0}
        run: |
          cd MLProject
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            mlflow run . --env-manager=conda \
              -P test_size=0.2 \
              -P random_state=42 \
              -P n_estimators=${{ github.event.inputs.n_estimators }} \
              -P max_depth=${{ github.event.inputs.max_depth }}
          else
            mlflow run . --env-manager=conda \
              -P test_size=0.2 \
              -P random_state=42 \
              -P n_estimators=100 \
              -P max_depth=10
          fi
      
      # ========== STEP 7: GET LATEST MLFLOW RUN_ID ==========
      - name: Get latest MLflow run_id
        run: |
          cd MLProject
          if [ -f "run_id.txt" ]; then
            RUN_ID=$(cat run_id.txt)
            echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
            echo "✅ Run ID: $RUN_ID"
          else
            echo "⚠️ run_id.txt not found"
          fi
      
      # ========== STEP 8: INSTALL PYTHON DEPENDENCIES ==========
      - name: Install Python dependencies
        run: |
          pip install google-auth google-auth-oauthlib google-api-python-client
      
      # ========== STEP 9: UPLOAD TO GOOGLE DRIVE ==========
      - name: Upload to Google Drive
        run: |
          cd MLProject
          zip -r mlflow-models.zip mlruns/
          echo "✅ Models compressed: mlflow-models.zip"
      
       # ========== STEP 10: BUILD DOCKER MODEL ==========
      - name: Build Docker Model
        run: |
          cd MLProject
          echo "🔍 DEBUG: Listing all model paths..."
          find mlruns -name "model.pkl" -type f
          echo ""
          echo "🔍 DEBUG: Listing all MLmodel files..."
          find mlruns -name "MLmodel" -type f
          echo ""
          echo "🔍 DEBUG: Full mlruns structure..."
          ls -la mlruns/
          find mlruns -type d
          echo ""
          
          # Try different possible model paths
          MODEL_PATH=""
          
          # Try to find random_forest_model
          if [ -d "mlruns/*/*/artifacts/random_forest_model" ]; then
            MODEL_PATH=$(find mlruns -name "random_forest_model" -type d | head -1)
          fi
          
          # If not found, try to find model directory directly
          if [ -z "$MODEL_PATH" ]; then
            MODEL_PATH=$(find mlruns -name "model" -type d | head -1)
          fi
          
          # If still not found, get the run directory and use default model path
          if [ -z "$MODEL_PATH" ]; then
            RUN_DIR=$(find mlruns -name "run_id.txt" -type f 2>/dev/null | head -1 | xargs dirname)
            if [ -n "$RUN_DIR" ]; then
              MODEL_PATH="$RUN_DIR/artifacts/random_forest_model"
            fi
          fi
          
          if [ -n "$MODEL_PATH" ] && [ -d "$MODEL_PATH" ]; then
            echo "✅ Model found at: $MODEL_PATH"
            mlflow models build-docker \
              -m "$MODEL_PATH" \
              -n "customer-shopping-model:latest" \
              --enable-mlserver \
              --env-manager local
          else
            echo "❌ Model not found in any expected location"
            echo "🔍 Full mlruns structure:"
            find mlruns -type d
            exit 1
          fi
      
      # ========== STEP 11: LOG IN TO DOCKER HUB ==========
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # ========== STEP 12: TAG DOCKER IMAGE ==========
      - name: Tag Docker Image
        run: |
          docker tag customer-shopping-model:latest ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:latest
          docker tag customer-shopping-model:latest ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:${{ github.run_number }}
      
      # ========== STEP 13: PUSH DOCKER IMAGE ==========
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:${{ github.run_number }}
      
      # ========== STEP 14: POST LOG IN TO DOCKER HUB ==========
      - name: Post Log in to Docker Hub
        run: echo "✅ Docker Hub operations completed"
      
      # ========== STEP 15: POST SET UP PYTHON 3.12.7 ==========
      - name: Post Set Up Python 3.12.7
        run: echo "✅ Python environment cleanup complete"
      
      # ========== STEP 16: POST RUN ACTIONS/CHECKOUT@V3 ==========
      - name: Post Run actions/checkout@v3
        run: echo "✅ Repository checkout cleanup complete"
      
      # ========== STEP 17: COMPLETE JOB ==========
      - name: Complete job
        run: |
          echo "=========================================="
          echo "🎉 JOB COMPLETED SUCCESSFULLY!"
          echo "=========================================="
          echo "📊 Run ID: ${{ env.RUN_ID }}"
          echo "🐳 Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/customer-shopping-model"
          echo "=========================================="
      
      # ========== STEP 18: UPLOAD ARTIFACT ==========
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-models
          path: MLProject/mlruns/
          retention-days: 30