name: MLflow Training CI/CD - Advanced

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Number of trees (n_estimators)'
        required: false
        default: '100'
      max_depth:
        description: 'Max depth of trees'
        required: false
        default: '10'

jobs:
  training:
    runs-on: ubuntu-latest
    
    steps:
      # ========== STEP 1: CHECKOUT ==========
      - name: Set up job
        run: echo "🚀 Starting MLflow Training Job (Advanced)"
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ========== STEP 2: SETUP PYTHON & CONDA ==========
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      
      - name: Install Miniconda (for conda.yaml)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.12.7
      
      - name: Check Environment
        run: |
          echo "✅ Python version: $(python --version)"
          echo "✅ Conda version: $(conda --version)"
          echo "✅ Current directory: $(pwd)"
          echo "✅ MLProject folder contents:"
          ls -la MLProject/
      
      # ========== STEP 3: CREATE CONDA ENV ==========
      - name: Create Conda environment from conda.yaml
        run: |
          cd MLProject
          conda env create -f conda.yaml
          echo "✅ Conda environment 'ml-training-env' created"
      
      # ========== STEP 4: RUN MLFLOW PROJECT ==========
      - name: Run MLflow Project
        run: |
          cd MLProject
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            conda run -n ml-training-env mlflow run . -P n_estimators=${{ github.event.inputs.n_estimators }} -P max_depth=${{ github.event.inputs.max_depth }}
          else
            conda run -n ml-training-env mlflow run .
          fi
      
      # ========== STEP 5: GET RUN ID ==========
      - name: Get latest MLflow run_id
        run: |
          cd MLProject
          RUN_ID=$(conda run -n ml-training-env python -c "import mlflow; print(mlflow.last_active_run().info.run_id)" 2>/dev/null || echo "unknown")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "✅ Latest run_id: $RUN_ID"
      
      # ========== STEP 6: UPLOAD TO GITHUB (ARTIFACT) ==========
      - name: Upload to GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-models
          path: |
            MLProject/mlruns/
          retention-days: 30
      
      # ========== STEP 7: BUILD DOCKER IMAGE ==========
      - name: Build Docker Model
        run: |
          cd MLProject
          # Find the model path
          MODEL_PATH=$(find mlruns -name "random_forest_model" -type d | head -1)
          if [ -n "$MODEL_PATH" ]; then
            echo "✅ Model found at: $MODEL_PATH"
            mlflow models build-docker \
              -m "$MODEL_PATH" \
              -n "customer-shopping-model:latest" \
              --enable-mlserver
          else
            echo "⚠️ No model found, waiting..."
            sleep 10
            MODEL_PATH=$(find mlruns -name "random_forest_model" -type d | head -1)
            mlflow models build-docker \
              -m "$MODEL_PATH" \
              -n "customer-shopping-model:latest" \
              --enable-mlserver
          fi
      
      # ========== STEP 8: DOCKER HUB LOGIN ==========
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # ========== STEP 9: TAG & PUSH DOCKER IMAGE ==========
      - name: Tag Docker Image
        run: |
          docker tag customer-shopping-model:latest ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:latest
          docker tag customer-shopping-model:latest ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:${{ github.run_number }}
          docker tag customer-shopping-model:latest ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:run-${{ github.run_id }}
      
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/customer-shopping-model:run-${{ github.run_id }}
      
      # ========== STEP 10: COMPLETE ==========
      - name: Complete job
        run: |
          echo "=========================================="
          echo "🎉 MLflow Training CI/CD COMPLETED!"
          echo "=========================================="
          echo "📦 Artifacts saved to GitHub"
          echo "🐳 Docker image pushed to Docker Hub"
          echo "🔗 Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/customer-shopping-model"
          echo "=========================================="